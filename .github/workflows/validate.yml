name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structure & link check
        run: |
          chmod +x validate.sh install.sh install-custom.sh
          ./validate.sh

      - name: IL math tests
        run: python3 tests/test_il.py

      - name: Position-decode tests
        run: python3 tests/test_fetch.py

      - name: CLI smoke test
        run: |
          python3 examples/il_calc.py --pa 140 --pb 210 --p0 170 --p 200 --json >/dev/null
          python3 examples/il_calc.py --pa 140 --pb 210 --p0 170 --p 200 --principal 10000 --fees 320 --json >/dev/null
          python3 examples/fetch_position.py --offline --current-tick 0 --open-tick 0 --json >/dev/null

      - name: Install script dry-run
        env:
          CLAUDE_DIR: /tmp/.claude-test
        run: ./install.sh -y --claude-dir=/tmp/.claude-test
