name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Structure & link check
        run: |
          chmod +x validate.sh install.sh install-custom.sh
          ./validate.sh

      - name: IL math tests
        run: python tests/test_il.py

      - name: Position-decode tests
        run: python tests/test_fetch.py

      - name: Eval suite (with-skill vs baseline)
        run: python tests/test_eval.py

      - name: DLMM TypeScript typecheck
        working-directory: examples/dlmm
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: CLI smoke test
        run: |
          python examples/il_calc.py --pa 140 --pb 210 --p0 170 --p 200 --json >/dev/null
          python examples/il_calc.py --pa 140 --pb 210 --p0 170 --p 200 --principal 10000 --fees 320 --json >/dev/null
          python examples/fetch_position.py --offline --current-tick 0 --open-tick 0 --json >/dev/null

      - name: Install script real-install test
        env:
          CLAUDE_DIR: /tmp/.claude-test
        run: ./install.sh -y --claude-dir=/tmp/.claude-test
