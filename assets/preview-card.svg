<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121c33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14f195"/>
      <stop offset="1" stop-color="#9945ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="8" fill="url(#acc)"/>

  <text x="80" y="120" font-size="22" fill="#8ab4f8" font-weight="600">Solana AI Kit · skill</text>
  <text x="80" y="190" font-size="56" font-weight="800" fill="#e8edf5">Position Manager</text>
  <text x="80" y="250" font-size="26" fill="#9fb2d4">CLMM / DLMM liquidity lifecycle</text>

  <!-- protocol chips -->
  <g font-size="20" font-weight="600">
    <rect x="80"  y="300" width="250" height="48" rx="24" fill="#16233d" stroke="#1f3358"/>
    <text x="205" y="331" text-anchor="middle" fill="#cfe0ff">Orca Whirlpools</text>
    <rect x="350" y="300" width="220" height="48" rx="24" fill="#16233d" stroke="#1f3358"/>
    <text x="460" y="331" text-anchor="middle" fill="#cfe0ff">Raydium CLMM</text>
    <rect x="590" y="300" width="240" height="48" rx="24" fill="#16233d" stroke="#1f3358"/>
    <text x="710" y="331" text-anchor="middle" fill="#cfe0ff">Meteora DLMM</text>
  </g>

  <!-- feature lines -->
  <g font-size="22" fill="#cfe0ff">
    <text x="80" y="410">✓ Impermanent-loss math — verified, unit-tested</text>
    <text x="80" y="450">✓ Out-of-range alerts + drift thresholds</text>
    <text x="80" y="490">✓ Rebalance decisions · simulate-before-sign</text>
    <text x="80" y="530">✓ Real RPC decode · Claude Code hook · CI</text>
  </g>

  <!-- right-side stat block -->
  <g>
    <rect x="900" y="170" width="220" height="200" rx="16" fill="#0e1730" stroke="#1f3358"/>
    <text x="1010" y="215" text-anchor="middle" font-size="48" font-weight="800" fill="#14f195">25</text>
    <text x="1010" y="245" text-anchor="middle" font-size="16" fill="#9fb2d4">unit tests</text>
    <text x="1010" y="300" text-anchor="middle" font-size="48" font-weight="800" fill="#9945ff">3</text>
    <text x="1010" y="330" text-anchor="middle" font-size="16" fill="#9fb2d4">protocols</text>
    <text x="1010" y="345" text-anchor="middle" font-size="13" fill="#6b7a99">verified SDK · MIT</text>
  </g>

  <text x="80" y="585" font-size="16" fill="#6b7a99">measure → monitor → decide → execute</text>
</svg>
